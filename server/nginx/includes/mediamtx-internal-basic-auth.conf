# Basic Auth para o upstream MediaMTX (authMethod: internal na porta :8888).
# O cliente real só passa pelo JWT (auth_request no nginx); isto é só servidor→servidor.
#
# Usar o utilizador `any` com password vazio (Base64 de "any:") — formato suportado pelo MediaMTX
# para leitura HLS (ver documentação: user any, pass vazio). Em algumas versões o user dedicado
# livebridge_hls_probe falha com 401 mesmo com YAML correcto; `any:` costuma alinhar com o interno.
# Se precisares do probe (ex. política no MTX), regera: printf '%s' 'USER:PASS' | base64 -w0
proxy_set_header Authorization "Basic YW55Og==";
