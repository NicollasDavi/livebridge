# Basic Auth para o upstream MediaMTX (authMethod: internal na porta :8888).
# O browser só passa pelo cookie JWT (auth_request); o nginx acrescenta credenciais internas ao proxy.
# Deve coincidir com o utilizador livebridge_hls_probe em server/mediamtx/mediamtx.yml.
# Se mudares a palavra-passe no YAML (ou LIVE_HLS_INTERNAL_BASIC_* na API), regera:
#   printf '%s' 'USER:PASS' | base64 -w0
# e coloca aqui: proxy_set_header Authorization "Basic <saida>";
proxy_set_header Authorization "Basic bGl2ZWJyaWRnZV9obHNfcHJvYmU6bGl2ZWJyaWRnZV9pbnRlcm5hbF9wcm9iZV9jaGFuZ2VfbWU=";
