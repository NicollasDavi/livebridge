# CI no GitHub + publish de imagens para GitHub Container Registry (ghcr.io).
# Deploy na VM é manual (docker compose pull) — ver docs/CI_CD.md.
name: CI/CD LiveBridge

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/ci-cd.yml'
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/ci-cd.yml'

concurrency:
  group: livebridge-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            server/api/package-lock.json
            server/merge/package-lock.json

      - name: Install API dependencies
        working-directory: server/api
        run: npm ci

      - name: Test API
        working-directory: server/api
        run: npm test

      - name: Install Merge dependencies
        working-directory: server/merge
        run: npm ci

      - name: Syntax check (API)
        working-directory: server/api
        run: |
          set -euo pipefail
          while IFS= read -r -d '' f; do
            node --check "$f"
          done < <(find . -name '*.js' -not -path './node_modules/*' -print0)

      - name: Syntax check (Merge)
        working-directory: server/merge
        run: |
          set -euo pipefail
          while IFS= read -r -d '' f; do
            node --check "$f"
          done < <(find . -name '*.js' -not -path './node_modules/*' -print0)

      - name: Validate docker compose
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml config --quiet
          if [ -f docker-compose.observability.yml ]; then
            docker compose -f docker-compose.yml -f docker-compose.observability.yml config --quiet
          fi

      - name: ShellCheck (transcode-abr.sh)
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          severity: error
          scandir: server/mediamtx
          format: gcc

  publish:
    name: Publish images (GHCR)
    needs: ci
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: publish-livebridge
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image names
        id: images
        run: |
          set -euo pipefail
          # ghcr.io exige owner/repo em minúsculas
          OWNER_REPO="$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          SHA="${GITHUB_SHA}"
          SHORT="${SHA:0:7}"
          BASE="ghcr.io/${OWNER_REPO}"
          {
            echo "api=${BASE}/api:${SHA}"
            echo "api_short=${BASE}/api:${SHORT}"
            echo "api_latest=${BASE}/api:latest"
            echo "merge=${BASE}/merge:${SHA}"
            echo "merge_short=${BASE}/merge:${SHORT}"
            echo "merge_latest=${BASE}/merge:latest"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push API
        working-directory: server/api
        run: |
          set -euo pipefail
          docker build \
            -t "${{ steps.images.outputs.api }}" \
            -t "${{ steps.images.outputs.api_short }}" \
            -t "${{ steps.images.outputs.api_latest }}" \
            .
          docker push "${{ steps.images.outputs.api }}"
          docker push "${{ steps.images.outputs.api_short }}"
          docker push "${{ steps.images.outputs.api_latest }}"

      - name: Build and push Merge
        working-directory: server/merge
        run: |
          set -euo pipefail
          docker build \
            -t "${{ steps.images.outputs.merge }}" \
            -t "${{ steps.images.outputs.merge_short }}" \
            -t "${{ steps.images.outputs.merge_latest }}" \
            .
          docker push "${{ steps.images.outputs.merge }}"
          docker push "${{ steps.images.outputs.merge_short }}"
          docker push "${{ steps.images.outputs.merge_latest }}"

      - name: Summary
        run: |
          echo "Imagens publicadas:"
          echo "  API:   ${{ steps.images.outputs.api }}"
          echo "  Merge: ${{ steps.images.outputs.merge }}"
          echo "Na VM: configurar API_IMAGE/MERGE_IMAGE no .env, depois:"
          echo "  git pull && docker compose pull api merge && docker compose up -d"
